# /var/lib/grafana/dashboards 폴더의 JSON 대시보드를 자동 로드하는 provider 정의.

apiVersion: 1
providers:
  - name: 'default'
    orgId: 1
    folder: 'Notification'
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
