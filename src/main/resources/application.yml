spring:
  application:
    name: NotificationDeliverySystem
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-worker
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ogu1208.notificationdeliverysystem.adapter.messaging.kafka
        # Consumer 크래시 감지 시간. Kafka 3.0+ 기본값을 명시적으로 유지한다.
        # notification.dispatch-lock.ttl-ms는 이 값보다 여유 있게 설정해 재전달 창을 락으로 덮는다.
        session.timeout.ms: 45000

notification:
  kafka:
    publish-timeout-ms: 3000
    topics:
      single-notification-send: single-notification-send
  outbox:
    publisher-enabled: false
    polling-interval-ms: 1000
    polling-batch-size: 100
    pending-min-age-ms: 3000
    recovery-interval-ms: 30000
    recovery-batch-size: 500
    processing-timeout-ms: 300000
  dispatch-lock:
    type: dummy
    # Kafka session.timeout.ms(45s)보다 크게 잡아 Consumer 크래시 후 재전달된 메시지가 락 만료 전에 도달하도록 한다.
    ttl-ms: 60000
  mock-send:
    base-url: http://localhost:8081
    connect-timeout-ms: 1000
    read-timeout-ms: 3000
  retry:
    publisher-enabled: false
    polling-interval-ms: 1000
    polling-batch-size: 100
    max-count: 3
    backoff-seconds: 10,20,30
  role:
    api-enabled: true
    worker-enabled: false
