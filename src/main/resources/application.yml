spring:
  application:
    name: NotificationDeliverySystem
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-worker
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ogu1208.notificationdeliverysystem.adapter.messaging.kafka

notification:
  kafka:
    publish-timeout-ms: 3000
    topics:
      single-notification-send: single-notification-send
  outbox:
    publisher-enabled: false
    polling-interval-ms: 1000
    polling-batch-size: 100
    recovery-interval-ms: 30000
    recovery-batch-size: 500
    processing-timeout-ms: 300000
  dispatch-lock:
    type: dummy
    ttl-ms: 30000
  role:
    api-enabled: true
    worker-enabled: false
